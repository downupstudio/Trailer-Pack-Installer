name: Release MSI

on:
  push:
    tags:
      - 'v*' 

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Release MSI
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Trailer Pack Installer v__VERSION__'
          releaseBody: 'Download and run the MSI to install Trailer Pack.'
          releaseDraft: false
          prerelease: false
          args: --bundles msi